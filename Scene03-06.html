<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06 写真撮影にまつわるフレーズ集</title>
    <!-- 共通スタイルシートの読み込み -->
    <link rel="stylesheet" href="common.css">
</head>
<body>
<div class="container">
    <h1>📸 06 写真撮影にまつわるフレーズ集</h1>
    <div class="nav-links">
        <a href="Scene03-05.html">◀ [Back] 05 ローカルフード</a>
        <a href="index.html">🏠 TOP（目次）</a>
        <a href="Scene03-07.html">[Next] 07 現地ツアー ➔</a>
    </div>
    <div class="settings-panel">
        <div class="setting-row">
            <span class="setting-label">🗣️ 英語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-en"></select>
                <button class="btn-test" id="btn-test-en">英語テスト 🔈</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">🇯🇵 日本語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-ja"></select>
                <button class="btn-test" id="btn-test-ja">日本語テスト 🔈</button>
            </div>
        </div>
        <div class="speed-control">
                <input type="range" id="rate-slider" min="0.5" max="1.2" step="0.05" value="0.8">
                <span id="speed-label" class="speed-val">0.80x</span>
            </div>
        </div>
        <div class="all-play-container">
            <button class="btn-play-all" id="btn-toggle-all">
                <span id="all-btn-icon">▶️</span>
                <span id="all-btn-text">全問を最初から連続再生</span>
            </button>
            <span id="all-play-status" class="play-all-status">全9問 停止中</span>
        </div>
    </div>
    <div id="phrases-list"></div>
</div>
<script>
    const data = [
        { id: 253, context: "美術館や博物館などで写真を撮るときは、写真ＯＫか必ず確認をとりましょう。", ja: "ここで写真を撮ってもいいですか？", en: "May I take pictures here?" },
        { id: 254, context: "誰かに写真を頼みたいときは", ja: "写真を撮っていただけますか？", en: "Could you take my picture, please?" },
        { id: 255, context: "ちょっと細かく指示を入れさせてもらいます。", ja: "あのビルを入れて写真を撮っていただけますか？", en: "Could you take a picture of me with that building?" },
        { id: 256, context: "もう少していねいにお願いしたいときは", ja: "すみませんが写真を撮っていただけませんか？", en: "Would you mind taking my picture?" },
        { id: 257, context: "カメラの扱いに慣れてなさそうな人には", ja: "そのボタンを押すだけです", en: "Just press the button." },
        { id: 258, context: "コスプレしている人や、ストリートでパフォーマンスをしている人の写真を撮りたいときは", ja: "あなたの写真を撮ってもいいですか？", en: "May I take your picture?" },
        { id: 259, context: "コスプレしている人や、ストリートでパフォーマンスをしている人と一緒に写真を撮りたいときは", ja: "あなたと一緒に写真をとってもかまいませんか？", en: "May I take a picture with you?" },
        { id: 260, context: "こういう言い方もあります。", ja: "私たちと一緒に写真に入っていただけませんか？", en: "Could you pose with us?" },
        { id: 261, context: "このかけ声は、万国共通？", ja: "はい、チーズ！", en: "Say cheese!" }
    ];
</script>
<script src="app-player.js"></script>
</body>
</html>
