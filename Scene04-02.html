<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02 ちょっと高級なレストランを予約しよう</title>
    <!-- 共通スタイルシートの読み込み -->
    <link rel="stylesheet" href="common.css">
</head>
<body>
<div class="container">
    <h1>🍷 02 ちょっと高級なレストランを予約しよう</h1>
    <div class="nav-links">
        <a href="Scene04-01.html">◀ [Back] 01 レストラン探し</a>
        <a href="index.html">🏠 TOP（目次）</a>
        <a href="Scene04-03.html">[Next] 03 着席～注文 ➔</a>
    </div>
    <div class="settings-panel">
        <div class="setting-row">
            <span class="setting-label">🗣️ 英語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-en"></select>
                <button class="btn-test" id="btn-test-en">英語テスト 🔈</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">🇯🇵 日本語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-ja"></select>
                <button class="btn-test" id="btn-test-ja">日本語テスト 🔈</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">🐢 再生速度 🐇</span>
            <div class="speed-control">
                <input type="range" id="rate-slider" min="0.5" max="1.2" step="0.05" value="0.8">
                <span id="speed-label" class="speed-val">0.80x</span>
            </div>
        </div>
        <div class="all-play-container">
            <button class="btn-play-all" id="btn-toggle-all">
                <span id="all-btn-icon">▶️</span>
                <span id="all-btn-text">全問を最初から連続再生</span>
            </button>
            <span id="all-play-status" class="play-all-status">全9問 停止中</span>
        </div>
    </div>
    <div id="phrases-list"></div>
</div>
<script>

    ];
</script>
<script src="app-player.js"></script>
</body>
</html>
