<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02 機内で映画を観る</title>
    <!-- 共通スタイルシートの読み込み -->
    <link rel="stylesheet" href="common.css">
</head>
<body>
<div class="container">
    <h1>🎬 02 機内で映画を観る</h1>
    <div class="nav-links">
        <a href="Scene01-01_2.html">◀ [Back] 01 空港到着</a>
        <a href="index.html">🏠 TOP（目次）</a>
        <a href="Scene01-03.html">[Next] 03 体調管理 ➔</a>
    </div>
    <div class="settings-panel">
        <div class="setting-row">
            <span class="setting-label">🗣️ 英語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-en"></select>
                <button class="btn-test" id="btn-test-en">英語テスト 🔈</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">🇯🇵 日本語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-ja"></select>
                <button class="btn-test" id="btn-test-ja">日本語テスト 🔈</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">🐢 再生速度 🐇</span>
            <div class="speed-control">
                <input type="range" id="rate-slider" min="0.5" max="1.2" step="0.05" value="0.8">
                <span id="speed-label" class="speed-val">0.80x</span>
            </div>
        </div>
        <div class="all-play-container">
            <button class="btn-play-all" id="btn-toggle-all">
                <span id="all-btn-icon">▶️</span>
                <span id="all-btn-text">全問を最初から連続再生</span>
            </button>
            <span id="all-play-status" class="play-all-status">全7問 停止中</span>
        </div>
    </div>
    <div id="phrases-list"></div>
</div>
<script>
    const data = [
        { id: 10, context: "フライト中最大の楽しみと言えばコレ。", ja: "何の映画が観られるんだろう", en: "I wonder what movies are on this flight." },
        { id: 11, context: "前の座席のポケットの中に番組ガイドが見つからないときは", ja: "映画の番組ガイドをいただけますか？", en: "May I have the movie guide?" },
        { id: 12, context: "予告編なら観たことがあるけど", ja: "この映画、まだ日本では公開されてないよ", en: "This movie hasn't been released in Japan yet." },
        { id: 13, context: "スクリーンが中央にひとつしかないような機内では", ja: "スクリーンが見えないんです", en: "I can't see the screen." },
        { id: 14, context: "スクリーンの近くに空席があるようなら", ja: "向こうへ移動してもいいですか？", en: "May I move over there?" },
        { id: 15, context: "ここ以外の席ならどこでもいい、というようなアンラッキーな席に当たってしまったら", ja: "席を変わってもいいですか？", en: "Can I change my seat?" },
        { id: 16, context: "チャンネルを変えても雑音しか聞こえてこない。そんなときは", ja: "イヤホンが壊れています", en: "My earphones don't work." }
    ];
</script>
<script src="app-player.js"></script>
</body>
</html>
