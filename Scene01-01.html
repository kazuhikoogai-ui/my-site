<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 空港到着～テイクオフ！</title>
    <!-- 共通スタイルシートの読み込み -->
    <link rel="stylesheet" href="common.css">
</head>
<body>
<div class="container">
    <h1>✈️ 01 空港到着～テイクオフ！</h1>
    <div class="nav-links">
    <a href="index.html">🏠 TOP（目次）</a>
        <a href="Scene01-02.html">[Next] 02 機内で映画を観る ➔</a>
    </div>
    <div class="settings-panel">
        <div class="setting-row">
            <span class="setting-label">🗣️ 英語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-en"></select>
                <button class="btn-test" id="btn-test-en">英語テスト 🔈</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">🇯🇵 日本語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-ja"></select>
                <button class="btn-test" id="btn-test-ja">日本語テスト 🔈</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">🐢 再生速度 🐇</span>
            <div class="speed-control">
                <input type="range" id="rate-slider" min="0.5" max="1.2" step="0.05" value="0.8">
                <span id="speed-label" class="speed-val">0.80x</span>
            </div>
        </div>
        <div class="all-play-container">
            <button class="btn-play-all" id="btn-toggle-all">
                <span id="all-btn-icon">▶️</span>
                <span id="all-btn-text">全問を最初から連続再生</span>
            </button>
            <span id="all-play-status" class="play-all-status">全9問 停止中</span>
        </div>
    </div>
    <div id="phrases-list"></div>
</div>
<script>
    const data = [
        { id: 1, context: "空港に着くと、その雰囲気だけでもう", ja: "ワクワクしてきた", en: "I'm getting excited." },
        { id: 2, context: "旅行中１００％何もないとは言い切れないのだから", ja: "保険に入っておいた方がいいよ", en: "You should take out some insurance." },
        { id: 3, context: "旅行経験値の高いしっかり者の友人には、思わず", ja: "頼りにしてるよ", en: "I'm counting on you." },
        { id: 4, context: "搭乗ゲートが開きました。", ja: "搭乗が始まったよ", en: "The flight is boarding." },
        { id: 5, context: "チケットを見ても座席がどこだかよくわからないときは", ja: "私の席はどこか教えていただけますか？", en: "Could you tell me where my seat is?" },
        { id: 6, context: "どう考えても自分の席なのに、見知らぬ人が座っていたら", ja: "ここは私の席なのですが", en: "I'm afraid this is my seat." },
        { id: 7, context: "自分で言う勇気のない人は、フライトアテンダントにヘルプを求めましょう。", ja: "誰かが私の席に座っているのですが", en: "Somebody is sitting in my seat." },
        { id: 8, context: "離陸間近に言われることは", ja: "シートベルトをお締めください", en: "Fasten your seat belt, please." },
        { id: 9, context: "シートベルトがなかなか締まらないときは", ja: "シートベルトの締め方を教えていただけますか？", en: "Could you show me how to fasten the seat belt?" }
    ];
</script>
<script src="app-player.js"></script>
</body>
</html>
