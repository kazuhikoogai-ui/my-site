    <style>

        .btn-play-all { background-color: #2ecc71; color: white; border: none; padding: 10px 18px; font-size: 0.95rem; font-weight: bold; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

        .card.active-playing .playing-badge { display: inline-block; }
        .btn-autoplay { background: #eafaf1; border: 1px solid #2ecc71; color: #27ae60; border-radius: 15px; padding: 3px 10px; font-size: 0.78rem; cursor: pointer; font-weight: bold; }

        .japanese { font-size: 1.15rem; font-weight: bold; color: #2c3e50; }
        .btn-mini-sound { background: #f0f3f6; border: 1px solid #d2d7dc; border-radius: 6px; padding: 3px 8px; font-size: 0.8rem; color: #4a5568; cursor: pointer; }
        .btn-show { background-color: #3498db; color: white; border: none; padding: 8px 16px; font-size: 0.95rem; border-radius: 6px; cursor: pointer; }

        .english { font-size: 1.25rem; font-weight: bold; color: #e67e22; margin-bottom: 10px; }
        .btn-replay { background: #ffffff; border: 1px solid #3498db; color: #3498db; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }

    <div class="nav-links">

    <div class="settings-panel">

                <select id="voice-select-en"></select>

        </div>
        <div class="setting-row">

        <div class="setting-row">

            <div class="speed-control">

        </div>
        <div class="all-play-container">

    <div id="phrases-list"></div>
</div>
