<body>
<div class="container">
    <h1>🛎️ 06 いろいろなサービスを活用する</h1>
    <div class="nav-links">
        <a href="Scene02-05.html">◀ [Back] 05 Ｂ＆Ｂ</a>

    <div class="settings-panel">
        <div class="setting-row">
            <span class="setting-label">🗣️ 英語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-en"></select>
                <button class="btn-test" id="btn-test-en">英語テスト 🔈</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">🇯🇵 日本語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-ja"></select>
                <button class="btn-test" id="btn-test-ja">日本語テスト 🔈</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">🐢 再生速度 🐇</span>
            <div class="speed-control">
                <input type="range" id="rate-slider" min="0.5" max="1.2" step="0.05" value="0.8">
                <span id="speed-label" class="speed-val">0.80x</span>
            </div>
        </div>
        <div class="all-play-container">
            <button class="btn-play-all" id="btn-toggle-all">
                <span id="all-btn-icon">▶️</span>
                <span id="all-btn-text">全問を最初から連続再生</span>
            </button>
            <span id="all-play-status" class="play-all-status">全12問 停止中</span>
        </div>
    </div>
    <div id="phrases-list"></div>
</div>
