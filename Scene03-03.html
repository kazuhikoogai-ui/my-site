<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 目的地への行き方を聞こう</title>
    <!-- 共通スタイルシートの読み込み -->
    <link rel="stylesheet" href="common.css">
</head>
<body>
<div class="container">
    <h1>🚏 03 目的地への行き方を聞こう</h1>
    <div class="nav-links">
        <a href="Scene03-02.html">◀ [Back] 02 道に迷ったら</a>
        <a href="index.html">🏠 TOP（目次）</a>
        <a href="Scene03-04.html">[Next] 04 美術館・博物館 ➔</a>
    </div>
    <div class="settings-panel">
        <div class="setting-row">
            <span class="setting-label">🗣️ 英語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-en"></select>
                <button class="btn-test" id="btn-test-en">英語テスト 🔈</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">🇯🇵 日本語の音声</span>
            <div class="voice-controls">
                <select id="voice-select-ja"></select>
                <button class="btn-test" id="btn-test-ja">日本語テスト 🔈</button>
            </div>
        </div>
        <div class="speed-control">
                <input type="range" id="rate-slider" min="0.5" max="1.2" step="0.05" value="0.8">
                <span id="speed-label" class="speed-val">0.80x</span>
            </div>
        </div>
        <div class="all-play-container">
            <button class="btn-play-all" id="btn-toggle-all">
                <span id="all-btn-icon">▶️</span>
                <span id="all-btn-text">全問を最初から連続再生</span>
            </button>
            <span id="all-play-status" class="play-all-status">全10問 停止中</span>
        </div>
    </div>
    <div id="phrases-list"></div>
</div>
<script>
    const data = [
        { id: 222, context: "バス停が近くにいくつもあってわかりづらいときは", ja: "ダウンタウンへのバス停はどこですか？", en: "Where is the bus stop for downtown?" },
        { id: 223, context: "「バス停はどこですか？」と聞かれたら", ja: "あそこです", en: "It's over there." },
        { id: 224, context: "方向音痴な私。歩いているうちに不安になってきました…", ja: "セイフコフィールドはこっちであってますか？", en: "Is this the right direction to Safeco Field?" },
        { id: 225, context: "行きたい場所を伝えたあとで その１", ja: "ここから遠いですか？", en: "Is it far from here?" },
        { id: 226, context: "行きたい場所を伝えたあとで その２", ja: "歩いて行けますか？", en: "Can I walk there?" },
        { id: 227, context: "「歩いて行けますか？」と聞いたときに予想される解答例 その１", ja: "歩くには遠すぎます", en: "It's too far to walk." },
        { id: 228, context: "「歩いて行けますか？」と聞いたときに予想される解答例 その２", ja: "バスに乗った方がいいですよ", en: "You should take a bus." },
        { id: 229, context: "１時間以内で行けるなら歩いて行ってみたいなあ、などと思ったら", ja: "徒歩でどれくらいかかりますか？", en: "How long does it take to go there on foot?" },
        { id: 230, context: "目的地までの所要時間を聞いたときに予想される解答例", ja: "３０分くらいかかります", en: "It takes about thirty minutes." },
        { id: 231, context: "地元の人とまちがわれて（？）道を聞かれてしまいました。", ja: "すみません、地元の人間じゃないんです", en: "I'm sorry but I'm not from around here." }
    ];
</script>
<script src="app-player.js"></script>
</body>
</html>
