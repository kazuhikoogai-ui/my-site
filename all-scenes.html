    <div id="phrases-list"></div>
</div>

        { id: 680, context: "【Scene09-03 警察へ届出】警察に聞かれるであろう質問 その３", ja: "お金はいくら持っていましたか？", en: "How much money did you have?" },
        { id: 681, context: "【Scene09-03 警察へ届出】財布の中身を説明します。", ja: "現金で３００ドルくらい持ってました", en: "I had about 300 dollars in cash." },
        { id: 682, context: "【Scene09-03 警察へ届出】保険に入っている場合、証明書があれば補償してもらえることがあるので", ja: "盗難証明書を作ってください", en: "Please make a certificate of theft." },
        { id: 683, context: "【Scene09-03 警察へ届出】証明書の発行をお願いすると、このように言われます。", ja: "この用紙に記入してください", en: "Fill out this form, please." },
        { id: 684, context: "【Scene09-03 警察へ届出】かなり望みは薄いけど、もし、万が一", ja: "見つかったら知らせてください", en: "Please let me know if you find it." },

        // --- Scene09-04 再発行の手続きは？ ---
        { id: 685, context: "【Scene09-04 再発行手続】クレジットカードを紛失したら、まずはカード会社に連絡して", ja: "カードを無効にしてください", en: "I'd like to cancel my credit card." },
        { id: 686, context: "【Scene09-04 再発行手続】カードナンバーを伝えます。", ja: "カードナンバーは１２３４－５６７８ー９９９９です", en: "My card number is 1234-5678-9999." },
        { id: 687, context: "【Scene09-04 再発行手続】パスポートを紛失してしまったら", ja: "日本大使館に連絡をとりたいのですが", en: "I'd like to contact the Japanese Embassy." },
        { id: 688, context: "【Scene09-04 再発行手続】クレジットカード・Ｔ／Ｃ・パスポート、どれを紛失しても必ず使うフレーズです。", ja: "再発行していただけますか？", en: "Could you reissue it?" },
        { id: 689, context: "【Scene09-04 再発行手続】署名欄にサインをしていないＴ／Ｃは無効とみなされます。", ja: "トラベラーズチェックの署名欄には全部サインがしてあります", en: "All traveler's checks have the holder's signature." },
        { id: 690, context: "【Scene09-04 再発行手続】再発行の手続きには、購入控えと身分証明が必要です。", ja: "これが購入控えです", en: "Here's the purchase agreement." },
        { id: 691, context: "【Scene09-04 再発行手続】購入控えも盗まれてしまったら…", ja: "購入控えも一緒に盗まれてしまいました", en: "My purchase agreement was stolen with them." },
        { id: 692, context: "【Scene09-04 再発行手続】カウンターサインをしてしまったＴ／Ｃは無効とみなされます。", ja: "カウンターサインはしてありません", en: "They are not countersigned." },

        // --- Scene09-05 交通事故・体調不良 ---
        { id: 693, context: "【Scene09-05 事故・体調不良】もしも友人が交通事故にあってしまったら", ja: "友人が車にはねられました", en: "My friend was hit by a car." },
        { id: 694, context: "【Scene09-05 事故・体調不良】救急車が必要なときは、このように伝えます。", ja: "救急車を呼んでください", en: "Please call an ambulance." },
        { id: 695, context: "【Scene09-05 事故・体調不良】友人の状況を伝えます。", ja: "（彼女は）ケガしています", en: "She's injured." },
        { id: 696, context: "【Scene09-05 事故・体調不良】友人の容態を冷静に伝えましょう。", ja: "（彼女は）ひどく出血しています", en: "She's bleeding heavily." },
        { id: 697, context: "【Scene09-05 事故・体調不良】救急車がすぐに呼べないような状況なら", ja: "（彼女に）応急処置をお願いします", en: "Please give her first aid." },
        { id: 698, context: "【Scene09-05 事故・体調不良】ホテルに滞在中具合が悪くなってしまったら、フロントに言いましょう。", ja: "医者に診てもらいたいのですが", en: "I'd like to see a doctor." },
        { id: 699, context: "【Scene09-05 事故・体調不良】専門のドクターがいるホテルもあります。", ja: "ホテルに医者はいますか？", en: "Do you have a doctor in the hotel?" },
        { id: 700, context: "【Scene09-05 事故・体調不良】体調などを英語で伝える自信がないときは、このように聞いてみましょう。", ja: "日本語を話せる医者はいますか？", en: "Is there a doctor who can speak Japanese?" },
        { id: 701, context: "【Scene09-05 事故・体調不良】外出先で急に具合が悪くなってしまったら", ja: "最寄の病院はどこですか？", en: "Where is the nearest hospital?" },
        { id: 702, context: "【Scene09-05 事故・体調不良】ドクターにまず聞かれること その１", ja: "どうされました？", en: "What's wrong?" },
        { id: 703, context: "【Scene09-05 事故・体調不良】ドクターにまず聞かれること その２", ja: "気分はどうですか？", en: "How do you feel?" },

        // --- Scene09-06 ドクターに症状を説明しよう その１ ---
        { id: 704, context: "【Scene09-06 症状説明1】ドクターに症状を説明しよう 内科系 その１", ja: "めまいがします", en: "I feel dizzy." },
        { id: 705, context: "【Scene09-06 症状説明1】ドクターに症状を説明しよう 内科系 その２", ja: "吐き気がします", en: "I feel sick." },
        { id: 706, context: "【Scene09-06 症状説明1】ドクターに症状を説明しよう 内科系 その３", ja: "体がだるいんです", en: "I feel drained." },
        { id: 707, context: "【Scene09-06 症状説明1】ドクターに症状を説明しよう 内科系 その４", ja: "寒気がします", en: "I have a chill." },
        { id: 708, context: "【Scene09-06 症状説明1】ドクターに症状を説明しよう 内科系 その５", ja: "熱があります", en: "I have a fever." },
        { id: 709, context: "【Scene09-06 症状説明1】ドクターに症状を説明しよう 内科系 その６", ja: "のどが痛いです", en: "I have a sore throat." },
        { id: 710, context: "【Scene09-06 症状説明1】ドクターに症状を説明しよう 内科系 その７", ja: "頭が痛いんです", en: "I have a headache." },
        { id: 711, context: "【Scene09-06 症状説明1】ドクターに症状を説明しよう 内科系 その８", ja: "お腹が痛いんです", en: "I have a stomachache." },
        { id: 712, context: "【Scene09-06 症状説明1】ドクターに症状を説明しよう 内科系 その９", ja: "お腹をこわしてます", en: "I have an upset stomach." },
        { id: 713, context: "【Scene09-06 症状説明1】ドクターに症状を説明しよう 内科系 その１０", ja: "下痢をしています", en: "I have diarrhea." },

        // --- Scene09-07 ドクターに症状を説明しよう その２ ---
        { id: 714, context: "【Scene09-07 症状説明2】ドクターに症状を説明しよう 内科系 その１１", ja: "吐いてます", en: "I've been vomiting." },
        { id: 715, context: "【Scene09-07 症状説明2】ドクターに症状を説明しよう 内科系 その１２", ja: "咳をしています", en: "I've been coughing." },
        { id: 716, context: "【Scene09-07 症状説明2】ドクターに症状を説明しよう 内科系 その１３", ja: "くしゃみがとまりません", en: "I keep sneezing." },
        { id: 717, context: "【Scene09-07 症状説明2】ドクターに症状を説明しよう 内科系 その１４", ja: "息がくるしいです", en: "I have difficulty breathing." },
        { id: 718, context: "【Scene09-07 症状説明2】ドクターに症状を説明しよう 内科系 その１５", ja: "ここが痛みます", en: "I have a pain right here." },
        { id: 719, context: "【Scene09-07 症状説明2】ドクターに症状を説明しよう 内科系 その１６", ja: "食欲がありません", en: "I have no appetite." },
        { id: 720, context: "【Scene09-07 症状説明2】ドクターに症状を説明しよう 外科系 その１", ja: "手をやけどしました", en: "I burned my hand." },
        { id: 721, context: "【Scene09-07 症状説明2】ドクターに症状を説明しよう 外科系 その２", ja: "手をガラスで切ってしまいました", en: "I cut my hand on some glass." },
        { id: 722, context: "【Scene09-07 症状説明2】ドクターに症状を説明しよう 外科系 その３", ja: "足が折れているみたいです", en: "I think my leg is broken." },

        // --- Scene09-08 ドクターとの重要な会話 ---
        { id: 723, context: "【Scene09-08 医師との対話】診察中、ドクターに聞かれるかもしれないこと その１", ja: "何かアレルギーはありますか？", en: "Do you have any allergies?" },
        { id: 724, context: "【Scene09-08 医師との対話】診察中、ドクターに聞かれるかもしれないこと その２", ja: "何か持病はありますか？", en: "Do you have any chronic illnesses?" },
        { id: 725, context: "【Scene09-08 医師との対話】必ず伝えておきたいこと その１", ja: "抗生物質にアレルギーがあるんです", en: "I'm allergic to antibiotics." },
        { id: 726, context: "【Scene09-08 医師との対話】必ず伝えておきたいこと その２", ja: "この薬を毎日飲んでます", en: "I take this medicine everyday." },
        { id: 727, context: "【Scene09-08 医師との対話】必ず伝えておきたいこと その３", ja: "妊娠しています", en: "I'm pregnant." },
        { id: 728, context: "【Scene09-08 医師との対話】今の症状に心当たりがあるなら、すべて話しておきましょう。", ja: "生のカニに当たったんだと思います", en: "I think I got ill by eating raw crab." },
        { id: 729, context: "【Scene09-08 医師との対話】これからどうすればよいか聞いておきましょう。", ja: "旅を続けられますか？", en: "Can I continue my trip?" },
        { id: 730, context: "【Scene09-08 医師との対話】いちばん気になることは", ja: "治るまでどれくらいかかるでしょうか？", en: "How long will it take to recover?" },
        { id: 731, context: "【Scene09-08 医師との対話】明日帰国で、何時間にも及ぶフライトがひかえていたら", ja: "明日飛行機に乗れますか？", en: "Can I get on an airplane tomorrow?" },
        { id: 732, context: "【Scene09-08 医師との対話】腹痛の原因は盲腸とのこと。手術するんだとしたら…", ja: "入院しなくてはなりませんか？", en: "Do I have to stay in the hospital?" },

        // --- Scene09-09 ドクターがよく言うフレーズ集 ---
        { id: 733, context: "【Scene09-09 医師の指示】レントゲンを撮るときや、背中に聴診器をあてられたときに言われます。", ja: "息を大きく吸って", en: "Take a deep breath." },
        { id: 734, context: "【Scene09-09 医師の指示】のどを診察するときに言われます。", ja: "口を開けて", en: "Open your mouth." },
        { id: 735, context: "【Scene09-09 医師の指示】こう言われたら、診察台の上に横になりましょう。", ja: "そこに横になってください", en: "Please lie down there." },
        { id: 736, context: "【Scene09-09 医師の指示】覚えておくと安心して診察が受けられるフレーズ その１", ja: "血圧を計ります", en: "I'm going to check your blood pressure." },
        { id: 737, context: "【Scene09-09 医師の指示】覚えておくと安心して診察が受けられるフレーズ その２", ja: "熱を計ります", en: "I'm going to check your temperature." },
        { id: 738, context: "【Scene09-09 医師の指示】覚えておくと安心して診察が受けられるフレーズ その３", ja: "注射します", en: "I'm going to give you a shot." },
        { id: 739, context: "【Scene09-09 医師の指示】覚えておくと安心して診察が受けられるフレーズ その４", ja: "血液検査をします", en: "I'm going to test your blood." },
        { id: 740, context: "【Scene09-09 医師の指示】ドクターからの指示例 その１", ja: "２，３日よく休んでください", en: "Take a good rest for a couple of days." },
        { id: 741, context: "【Scene09-09 医師の指示】ドクターからの指示例 その２", ja: "お酒とタバコはしばらく控えてください", en: "Please refrain from drinking and smoking for a while." },
        { id: 742, context: "【Scene09-09 医師の指示】ドクターからの指示例 その３", ja: "手術が必要です", en: "You need to have an operation." },

        // --- Scene09-10 診察を終えて薬をもらう ---
        { id: 743, context: "【Scene09-10 処方薬・会計】保険に入っていれば、診察代も補償してもらえます。", ja: "旅行保険に入っています", en: "I have traveler's insurance." },
        { id: 744, context: "【Scene09-10 処方薬・会計】診察代を保険会社に請求するとき必要なので", ja: "診断書を書いていただけますか？", en: "Could you write a medical certificate?" },
        { id: 745, context: "【Scene09-10 処方薬・会計】受付からの指示", ja: "この処方箋を薬局に持って行って薬を買ってください", en: "Take this prescription to a pharmacy and buy medicine." },
        { id: 746, context: "【Scene09-10 処方薬・会計】薬局の場所を聞いておきましょう。", ja: "一番近い薬局はどこですか？", en: "Where is the nearest pharmacy?" },

        { id: 748, context: "【Scene09-10 処方薬・会計】薬の飲み方は、しっかり聞いておきましょう。", ja: "どのように服用したらいいですか？", en: "How should I take this?" },
        { id: 749, context: "【Scene09-10 処方薬・会計】薬局からの指示", ja: "この薬を１日３回食後に飲んでください", en: "Take this medicine three times a day after meals." },
        { id: 750, context: "【Scene09-10 処方薬・会計】薬に関して気になることは、きちんと聞いておきましょう。", ja: "この薬には副作用はありますか？", en: "Does this medicine have any side-effects?" },
        { id: 751, context: "【Scene09-10 処方薬・会計】車を運転しなければならないとき、気になることは", ja: "この薬で眠くなりますか？", en: "Will this medicine make me sleepy?" },
        { id: 752, context: "【Scene09-10 処方薬・会計】いろいろと心配をかけた友人やフロントの人には、\"Thank you.\"の言葉とともに", ja: "だいぶ気分がよくなりました", en: "I feel much better." },

        // --- Scene10-01 覚えておきたい！ベーシック・フレーズ集 ---
        { id: 753, context: "【Scene10-01 ベーシック】よく使うフレーズ 第１位！声をかけるとき、ちょっとしたことを謝るときに", ja: "すみません", en: "Excuse me." },
        { id: 754, context: "【Scene10-01 ベーシック】相手の言うことを聞き返すときは", ja: "なんとおっしゃいました？", en: "Pardon?" },
        { id: 755, context: "【Scene10-01 ベーシック】ていねいにお願いしたいときは", ja: "もう一度言っていただけますか？", en: "Could you say that again?" },
        { id: 756, context: "【Scene10-01 ベーシック】相手の言っていることは何となく聞き取れるものの、単語がさっぱりわからないときは", ja: "もっと簡単に言っていただけますか？", en: "Could you say that more simply?" },
        { id: 757, context: "【Scene10-01 ベーシック】相手の話すペースが速くて聞き取れないときは", ja: "もっとゆっくり話していただけますか？", en: "Could you speak more slowly, please?" },
        { id: 758, context: "【Scene10-01 ベーシック】相手の言っていることは聞き取れたけど、意味がわからないときは", ja: "それはどういう意味ですか？", en: "What do you mean by that?" },
        { id: 759, context: "【Scene10-01 ベーシック】標識やパンフレット、注意書きなどで、意味のわからない箇所があったら", ja: "これはどういう意味ですか？", en: "What does this mean?" },
        { id: 760, context: "【Scene10-01 ベーシック】未知の物体に遭遇したときはもちろん、請求書に覚えのない項目があったときでも", ja: "これは何ですか？", en: "What's this?" },

        // --- Scene10-02 コミュニケーションを円滑にするために ---
        { id: 761, context: "【Scene10-02 会話を円滑に】レストランやホテルの人、道ゆく人などが気軽に交わすあいさつ", ja: "よい一日を！", en: "Have a nice day!" },
        { id: 762, context: "【Scene10-02 会話を円滑に】空港、ツーリストインフォメーション、ホテルの人などによく言われる言葉は", ja: "滞在を楽しんでくださいね", en: "Enjoy your stay." },
        { id: 763, context: "【Scene10-02 会話を円滑に】人に道をゆずるときや、レストランにて先に料理がきた友人に", ja: "お先にどうぞ", en: "Go ahead." },
        { id: 764, context: "【Scene10-02 会話を円滑に】ひととおり話し終えたときや、レストランで注文し終えたときに", ja: "以上です", en: "That's it." },
        { id: 765, context: "【Scene10-02 会話を円滑に】「日本っていうと、あの小さな島国よね？」などと言われたときは", ja: "そのとおり", en: "That's right." },
        { id: 766, context: "【Scene10-02 会話を円滑に】「和式のトイレってどうしてあんな形なの？」なんて聞かれて", ja: "わかりません", en: "I don't know." },
        { id: 767, context: "【Scene10-02 会話を円滑に】「※×＆％＃＠~＄＊！？」とまくしたてられたら", ja: "わかりません", en: "I don't understand." },
        { id: 768, context: "【Scene10-02 会話を円滑に】大切な物を壊してしまう、というレベルのことをしでかしてしまったら", ja: "本当にすみません", en: "I'm terribly sorry." },
        { id: 769, context: "【Scene10-02 会話を円滑に】「ありがとう」よりも強い感謝の気持ちを表したいときは", ja: "本当にありがとう", en: "Thank you very much indeed." },
        { id: 770, context: "【Scene10-02 会話を円滑に】フォームに記入したり署名したりしたときは、相手に見せつつ", ja: "これでいいですか？", en: "Is this OK?" },
        { id: 771, context: "【Scene10-02 会話を円滑に】英語力不足が原因で、気まずい事態になってしまったときは", ja: "すみません、英語は苦手なんです", en: "Sorry, I'm not good at English." },
        { id: 772, context: "【Scene10-02 会話を円滑に】公共の場などで、英語でうまく意思を伝えられないときは", ja: "日本語の話せる方はいますか？", en: "Is there someone who can speak Japanese?" },

        // --- Scene10-03 覚えておきたい！自己紹介フレーズ集 ---
        { id: 773, context: "【Scene10-03 自己紹介】右手を差し出しながら言ってみるのもいいかもしれません。", ja: "はじめまして！", en: "Nice to meet you!" },
        { id: 774, context: "【Scene10-03 自己紹介】英語で自己紹介するときは、ファーストネームを名乗る方がしっくりします。", ja: "健太郎です", en: "I'm Kentaro." },
        { id: 775, context: "【Scene10-03 自己紹介】日本人の名前は覚えにくいので、ニックネームで。", ja: "ケンと呼んで下さい", en: "Please call me Ken." },
