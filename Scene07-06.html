    <style>

        .speed-val { font-weight: bold; color: #2980b9; min-width: 45px; text-align: right; }
        .all-play-container { margin-top: 4px; padding-top: 10px; border-top: 1px solid #edf2f7; display: flex; align-items: center; justify-content: space-between; }
        .btn-play-all { background-color: #2ecc71; color: white; border: none; padding: 10px 18px; font-size: 0.95rem; font-weight: bold; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-play-all.playing { background-color: #e74c3c; }
        .play-all-status { font-size: 0.88rem; font-weight: bold; color: #7f8c8d; }

        .context { font-size: 0.88rem; color: #7f8c8d; }
        .playing-badge { display: none; background-color: #e67e22; color: white; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
        .card.active-playing .playing-badge { display: inline-block; }
        .btn-autoplay { background: #eafaf1; border: 1px solid #2ecc71; color: #27ae60; border-radius: 15px; padding: 3px 10px; font-size: 0.78rem; cursor: pointer; font-weight: bold; }
        .japanese-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .japanese { font-size: 1.15rem; font-weight: bold; color: #2c3e50; }
        .btn-mini-sound { background: #f0f3f6; border: 1px solid #d2d7dc; border-radius: 6px; padding: 3px 8px; font-size: 0.8rem; color: #4a5568; cursor: pointer; }
        .btn-show { background-color: #3498db; color: white; border: none; padding: 8px 16px; font-size: 0.95rem; border-radius: 6px; cursor: pointer; }
        .english-area { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed #e0e0e0; }
        .english { font-size: 1.25rem; font-weight: bold; color: #e67e22; margin-bottom: 10px; }
        .btn-replay { background: #ffffff; border: 1px solid #3498db; color: #3498db; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }

    <div class="nav-links">

    <div class="settings-panel">
        <div class="setting-row">

            <div class="voice-controls">
                <select id="voice-select-en"></select>
                <button class="btn-test" id="btn-test-en">英語テスト 🔈</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">🇯🇵 日本語の音声</span>

        </div>
        <div class="setting-row">
            <span class="setting-label">🐢 再生速度 🐇</span>
            <div class="speed-control">
                <input type="range" id="rate-slider" min="0.5" max="1.2" step="0.05" value="0.8">
                <span id="speed-label" class="speed-val">0.80x</span>
            </div>
        </div>
        <div class="all-play-container">
            <button class="btn-play-all" id="btn-toggle-all">
                <span id="all-btn-icon">▶️</span>
                <span id="all-btn-text">全問を最初から連続再生</span>
            </button>
            <span id="all-play-status" class="play-all-status">全11問 停止中</span>

    </div>
    <div id="phrases-list"></div>
</div>
